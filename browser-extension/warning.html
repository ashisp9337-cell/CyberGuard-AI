<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>main{max-width:640px;margin:8vh auto;padding:0 16px}.big{font-size:44px;line-height:1;margin-bottom:10px;color:var(--danger)}</style></head>
<body><main>
  <div class="card" style="border-color:#7f1d1d">
    <div class="big" aria-hidden="true">&#9888;&#xFE0E;</div>

    <ul id="reasons"></ul>
  </div>

    <button id="back">Go back to safety</button>
    <button id="go" class="ghost">I understand the risk - open it anyway</button>
  </div>
