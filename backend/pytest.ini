[pytest]
testpaths = tests
# Own temp folder inside the project: avoids a Windows "Access is denied" error when pytest tidies
# its shared temp folder in AppData at the end of a run. The folder is emptied at the start of each run.
addopts = --basetemp=.pytest_tmp
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient