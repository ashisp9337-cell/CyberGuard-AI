version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard_dev_password
      POSTGRES_DB: cyberguard
    ports:
      - "127.0.0.1:5432:5432"   # this computer only - never the Wi-Fi / LAN (6 Nov security check)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env    # JWT_SECRET and the other secrets come from here, never from this file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://cyberguard:cyberguard_dev_password@postgres:5432/cyberguard
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports

  frontend:
    build: .
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
  backend_reports:
